name: Deploy ReelLab AI Worker

on:
  push:
    branches: [main]
    paths:
      - "ai-worker/**"
      - ".github/workflows/deploy-ai-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-ai-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Deploy Worker with Gemini secret
        working-directory: ai-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          SECRETS_FILE="$RUNNER_TEMP/reellab-secrets.env"
          printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" > "$SECRETS_FILE"
          npx --yes wrangler@4.133.0 deploy --config wrangler.jsonc --secrets-file "$SECRETS_FILE"
          rm -f "$SECRETS_FILE"
