name: ReelLab Smoke Test
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required files
        run: |
          test -s index.html
          test -s style.css
          test -s app.js
          test -s engine-v2.js
          test -s engine-v3.js
          test -s manifest.webmanifest
          test -s icon.svg
          test -s 404.html
          grep -q 'style.css' index.html
          grep -q 'app.js' index.html
          grep -q 'engine-v2.js' index.html
          grep -q 'engine-v3.js' index.html
          grep -q 'manifest.webmanifest' index.html
      - name: Static syntax, security and intelligence checks
        run: |
          node --check app.js
          node --check engine-v2.js
          node --check engine-v3.js
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          js=Path('app.js').read_text(encoding='utf-8')
          v2=Path('engine-v2.js').read_text(encoding='utf-8')
          v3=Path('engine-v3.js').read_text(encoding='utf-8')
          manifest=Path('manifest.webmanifest').read_text(encoding='utf-8')
          for token in ('<!doctype html>', 'lang="fa"', 'dir="rtl"', 'id="analyzeBtn"', 'id="results"', 'id="saveExperimentBtn"', 'id="historyList"', 'id="hookInput"', 'id="captionSuggestion"', 'id="hashtags"', 'id="timingOptions"', 'id="reelTopic"'):
              assert token in html, token
          for token in ('localStorage', 'textContent', 'STORAGE_KEY', 'MAX_HISTORY', 'navigator.clipboard', 'sampleFrames', 'readOcr', 'visualObjects', 'inferTopic', 'topicTags'):
              assert token in js, token
          for token in ('cleanSpeech', 'cleanOcr', 'detect', 'score', 'موضوع نامشخص', 'MutationObserver', 'reelTopic'):
              assert token in v2, token
          for token in ('frameStats', 'brightness', 'contrast', 'motion', 'REAL REEL AUDIT', 'MutationObserver', 'node'):
              assert token in v3, token
          assert 'innerHTML' not in js
          assert 'innerHTML' not in v2
          assert 'innerHTML' not in v3
          assert 'fetch(' not in js
          assert 'XMLHttpRequest' not in js
          assert 'fetch(' not in v2
          assert 'XMLHttpRequest' not in v2
          assert 'fetch(' not in v3
          assert 'XMLHttpRequest' not in v3
          assert 'makeTiming' not in js
          assert '۱۹:۰۰–۲۱:۳۰' not in js
          assert '۱۲:۳۰–۱۴:۰۰' not in js
          assert 'manifest.webmanifest' in html
          assert 'icon.svg' in manifest
          assert 'display' in manifest and 'standalone' in manifest
          assert len(Path('style.css').read_text(encoding='utf-8')) > 1000
          print('ReelLab hardened intelligence smoke test passed')
          PY
