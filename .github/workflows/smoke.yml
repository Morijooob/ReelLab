name: ReelLab Smoke Test
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required files
        run: |
          test -s index.html
          test -s style.css
          test -s app.js
          test -s manifest.webmanifest
          test -s icon.svg
          test -s 404.html
          grep -q 'style.css' index.html
          grep -q 'app.js' index.html
          grep -q 'manifest.webmanifest' index.html
      - name: Static syntax and security checks
        run: |
          node --check app.js
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          js=Path('app.js').read_text(encoding='utf-8')
          manifest=Path('manifest.webmanifest').read_text(encoding='utf-8')
          for token in ('<!doctype html>', 'lang="fa"', 'dir="rtl"', 'id="analyzeBtn"', 'id="results"', 'id="saveExperimentBtn"', 'id="historyList"', 'id="hookInput"', 'id="captionSuggestion"', 'id="hashtags"', 'id="timingOptions"'):
              assert token in html, token
          for token in ('localStorage', 'textContent', 'STORAGE_KEY', 'MAX_HISTORY', 'navigator.clipboard'):
              assert token in js, token
          assert 'innerHTML' not in js
          assert 'fetch(' not in js
          assert 'XMLHttpRequest' not in js
          assert 'manifest.webmanifest' in html
          assert 'icon.svg' in manifest
          assert 'display' in manifest and 'standalone' in manifest
          assert len(Path('style.css').read_text(encoding='utf-8')) > 1000
          print('ReelLab pre-publish hardening smoke test passed')
          PY
